site_name: dspy-langchain-bridge
site_url: https://dspy-langchain-bridge.readthedocs.io
repo_url: https://github.com/ANIMESHIOLOGY/dspy-langchain-bridge
repo_name: ANIMESHIOLOGY/dspy-langchain-bridge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - tables

nav:
  - Home: index.md
  - Installation: installation.md
  - Compatibility Matrix: compatibility-matrix.md
  - Getting Started:
      - Basic Runnable: getting-started/basic-runnable.md
      - RAG Pipeline: getting-started/rag-pipeline.md
      - Optimizer: getting-started/optimizer.md
  - API Reference:
      - runnables: api-reference/runnables.md
      - llms: api-reference/llms.md
      - signatures: api-reference/signatures.md
      - retrievers: api-reference/retrievers.md
      - tools: api-reference/tools.md
      - memory: api-reference/memory.md
      - optimizers: api-reference/optimizers.md
      - callbacks: api-reference/callbacks.md
  - Migration Guide: migration-guide.md
